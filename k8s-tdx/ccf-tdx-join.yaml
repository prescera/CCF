apiVersion: v1
kind: Service
metadata:
  name: ccf-tdx-2
  namespace: ccf-tdx
spec:
  clusterIP: 10.43.22.62
  selector: { app: ccf-tdx-2 }
  ports:
    - { name: rpc, port: 8000, targetPort: 8000 }
    - { name: n2n, port: 8001, targetPort: 8001 }
---
apiVersion: v1
kind: Pod
metadata:
  name: ccf-tdx-2
  namespace: ccf-tdx
  labels: { app: ccf-tdx-2 }
  annotations:
    io.katacontainers.config.hypervisor.cc_init_data: ""
spec:
  runtimeClassName: kata-qemu-tdx
  restartPolicy: Never
  initContainers:
    - name: stage
      image: localhost:5000/ccf-tdx:v8
      command:
        - sh
        - -c
        - |
          set -eux
          mkdir -p /host/ledger /host/snapshots
          cp /svc/service_cert.pem /host/service_cert.pem
          ls -l /host
      volumeMounts:
        - { name: svc, mountPath: /svc, readOnly: true }
        - { name: host, mountPath: /host }
  containers:
    - name: cchost
      image: localhost:5000/ccf-tdx:v8
      command:
        - sh
        - -c
        - |
          set -eu
          mount -t configfs none /sys/kernel/config
          test -d /sys/kernel/config/tsm/report
          exec cchost --config /opt/ccf-tdx/node-config-join.json
      securityContext:
        capabilities:
          add: [SYS_ADMIN]
      workingDir: /host
      ports:
        - { name: rpc, containerPort: 8000 }
        - { name: n2n, containerPort: 8001 }
      volumeMounts:
        - { name: host, mountPath: /host }
      resources:
        requests: { cpu: "2", memory: 2Gi }
        limits: { cpu: "2", memory: 4Gi }
  volumes:
    - name: svc
      configMap: { name: ccf-tdx-service-cert }
    - name: host
      emptyDir: {}
